name: Multi-Agent AI Operations Hub CI

on:
  push:
    paths:
      - "projects/multi-agent-ai-operations-hub/**"
      - ".github/workflows/operations-hub-ci.yml"
  pull_request:
    paths:
      - "projects/multi-agent-ai-operations-hub/**"
      - ".github/workflows/operations-hub-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit, contract, workflow export, and synthetic E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/multi-agent-ai-operations-hub
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the 178-test suite
        run: npm test

      - name: Verify no active workflow or exported credential object
        run: node scripts/verify-public-export-safety.mjs
