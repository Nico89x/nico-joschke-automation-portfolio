name: Portfolio website checks
on:
  push:
    paths: ['*.html', '*.css', 'README.md', '*.json', '*.pdf', '*.svg', 'test/**', '.github/workflows/portfolio-site-ci.yml', 'projects/release-support-triage/**']
  pull_request:
    paths: ['*.html', '*.css', 'README.md', '*.json', '*.pdf', '*.svg', 'test/**', '.github/workflows/portfolio-site-ci.yml', 'projects/release-support-triage/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24}
      - name: Check links, case studies, accessibility structure and offered exports
        run: node --test test/portfolio-site.test.mjs
