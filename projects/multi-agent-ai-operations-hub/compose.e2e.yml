services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: portfolio_e2e
      POSTGRES_USER: portfolio_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?generated by runner}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U portfolio_e2e -d portfolio_e2e]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_e2e:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.5
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: portfolio_e2e
      DB_POSTGRESDB_USER: portfolio_e2e
      DB_POSTGRESDB_PASSWORD: ${E2E_DB_PASSWORD:?generated by runner}
      N8N_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?generated by runner}
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      GENERIC_TIMEZONE: Europe/Berlin
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['127.0.0.1::5678']
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:5678/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - n8n_e2e:/home/node/.n8n
      - ./.e2e-local:/files/fixture:ro
volumes:
  postgres_e2e:
  n8n_e2e:
